<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>需求庫 · 美感數位教科書入校試用</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark"></span>
        <span class="brand-name">需求庫</span>
      </a>
      <div class="header-meta">
        <span id="meta-counts">—</span>
        <span class="meta-dot">·</span>
        <span id="meta-date">—</span>
      </div>
    </div>
    <div class="search-wrap">
      <input
        id="search"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="搜尋關鍵字、編號、標題、原句…"
      />
      <button id="search-clear" class="search-clear" type="button" aria-label="清除搜尋" hidden>×</button>
    </div>
    <div class="filters" id="filters" role="toolbar" aria-label="篩選">
      <div class="filter-group" data-group="perspective" aria-label="視角">
        <button class="chip is-active" data-perspective="all">全部</button>
        <button class="chip chip-student" data-perspective="student">學生視角</button>
        <button class="chip chip-teacher" data-perspective="teacher">老師視角</button>
        <button class="chip chip-insights" data-perspective="insights">跨視角洞察</button>
      </div>
      <div class="filter-group filter-categories" data-group="category" id="category-chips" aria-label="類別"></div>
    </div>
  </header>

  <main id="main">
    <section id="empty-state" class="empty-state">
      <h2 class="empty-title">V1 入校試用紀錄</h2>
      <div class="empty-hint-row">
        <span class="hint-label">試試</span>
        <button class="hint" data-q="翻頁">翻頁</button>
        <button class="hint" data-q="小細胞">小細胞</button>
        <button class="hint" data-q="家長">家長</button>
        <button class="hint" data-q="自編">自編</button>
        <button class="hint" data-q="星際巡航">星際巡航</button>
        <button class="hint" data-q="網路">網路</button>
      </div>
    </section>

    <section id="category-overview" class="category-overview" hidden>
      <div class="overview-summary" id="overview-summary"></div>
      <div class="overview-list" id="overview-list"></div>
    </section>

    <section id="results" class="results" hidden>
      <div class="results-summary" id="results-summary"></div>
      <div class="card-list" id="card-list"></div>
    </section>

    <article id="insights" class="insights" hidden></article>
  </main>

  <aside id="panel" class="panel" hidden aria-hidden="true">
    <div class="panel-toolbar">
      <button id="panel-back" class="panel-btn" type="button" hidden aria-label="返回上一張">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>返回</span>
      </button>
      <span class="panel-spacer"></span>
      <button id="panel-close" class="panel-btn" type="button" aria-label="關閉">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
  <div id="panel-scrim" class="panel-scrim" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
